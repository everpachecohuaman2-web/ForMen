<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito – ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container my-5">

  <h4 class="mb-4"><i class="bi bi-cart4 me-2"></i>Carrito de Compras</h4>

  <!-- Alerta compra confirmada -->
  <div th:if="${confirmado}" class="alert alert-success d-flex align-items-center gap-2">
    <i class="bi bi-check-circle-fill fs-5"></i>
    <span>¡Compra realizada con éxito! Gracias por comprar en ForMen.</span>
  </div>

  <!-- Carrito vacío -->
  <div th:if="${#lists.isEmpty(items)}" class="text-center py-5">
    <i class="bi bi-cart-x fs-1 text-muted"></i>
    <p class="mt-3 text-muted">Tu carrito está vacío.</p>
    <a th:href="@{/}" class="btn btn-dark">Ver productos</a>
  </div>

  <!-- Tabla de productos -->
  <div th:if="${not #lists.isEmpty(items)}">
    <div class="table-responsive">
      <table class="table table-bordered table-striped align-middle text-center bg-white">
        <thead class="table-dark">
          <tr>
            <th>Producto</th>
            <th>Imagen</th>
            <th>Precio unit.</th>
            <th>Cantidad</th>
            <th>Subtotal</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${items}">
            <td class="text-start fw-semibold" th:text="${item.producto.nombre}">Producto</td>
            <td>
              <img th:src="${item.producto.imagenUrl}"
                   width="60" class="rounded" th:alt="${item.producto.nombre}">
            </td>
            <td th:text="'S/' + ${item.producto.precio}">S/0.00</td>
              <td>
                  <form th:action="@{/carrito/actualizar}" method="get">
                      <input type="hidden"
                             name="id"
                             th:value="${item.producto.id}">
                      <input type="number"
                             name="cantidad"
                             class="form-control form-control-sm w-50 mx-auto"
                             th:value="${item.cantidad}"
                             min="1"
                             onchange="this.form.submit()">
                  </form>
              </td>
            <td class="fw-bold" th:text="'S/' + ${item.subtotal}">S/0.00</td>
            <td>
              <a th:href="@{/carrito/eliminar(id=${item.producto.id})}"
                 class="btn btn-danger btn-sm">
                <i class="bi bi-trash me-1"></i>Eliminar
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Total y botón de compra -->
    <div class="d-flex justify-content-end mt-3">
      <div class="card border-0 shadow-sm p-3" style="min-width:260px;">
        <h6 class="fw-bold mb-1">Total del pedido</h6>
        <h3 class="text-success fw-bold mb-3"
            th:text="'S/' + ${#numbers.formatDecimal(total, 1, 2)}">S/0.00</h3>
        <a th:href="@{/carrito/checkout}" class="btn btn-dark w-100">
          <i class="bi bi-bag-check me-1"></i>Finalizar Compra
        </a>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm mt-2 w-100">
          Seguir comprando
        </a>
      </div>
    </div>
  </div>

</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
