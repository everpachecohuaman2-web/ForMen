<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ForMen – Moda Exclusiva</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- ICONOS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        .card-img-top{
            height:240px;
            object-fit:cover;
        }

        .product-card{
            transition: transform .2s, box-shadow .2s;
        }

        .product-card:hover{
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }

    </style>

</head>

<body class="bg-light">

<!-- NAVBAR -->
<div th:replace="~{fragments :: navbar}"></div>

<div th:replace="~{fragments :: alerts}"></div>

<!-- CONTENIDO -->
<div class="container my-5">

    <!-- TÍTULO -->
    <div class="mb-4 text-center">

        <h2 class="fw-bold">
            Nueva Colección
        </h2>

        <p class="text-muted">
            Descubre nuestras prendas exclusivas para cada ocasión
        </p>

    </div>

    <!-- BUSCADOR + FILTROS -->
    <form method="get" action="/">

        <div class="row g-2 mb-5">

            <!-- BUSCADOR -->
            <div class="col-md-4">

                <input type="text"
                       name="buscar"
                       class="form-control"
                       th:value="${buscar}"
                       placeholder="Buscar prenda...">

            </div>

            <!-- TALLA -->
            <div class="col-md-2">

                <select name="talla"
                        class="form-select">

                    <option value="Todas" th:selected="${talla == null || talla == 'Todas'}">Todas</option>
                    <option value="S" th:selected="${talla == 'S'}">S</option>
                    <option value="M" th:selected="${talla == 'M'}">M</option>
                    <option value="L" th:selected="${talla == 'L'}">L</option>
                    <option value="XL" th:selected="${talla == 'XL'}">XL</option>

                </select>

            </div>

            <!-- PRECIO MIN -->
            <div class="col-md-2">

                <input type="number"
                       name="precioMin"
                       class="form-control"
                       min="0"
                       step="0.01"
                       th:value="${precioMin}"
                       placeholder="Precio mín">

            </div>

            <!-- PRECIO MAX -->
            <div class="col-md-2">

                <input type="number"
                       name="precioMax"
                       class="form-control"
                       min="0"
                       step="0.01"
                       th:value="${precioMax}"
                       placeholder="Precio máx">

            </div>

            <!-- BOTÓN -->
            <div class="col-md-2">

                <button type="submit"
                        class="btn btn-dark w-100">

                    <i class="bi bi-search me-1"></i>
                    Buscar

                </button>

            </div>

        </div>

    </form>

    <!-- PRODUCTOS -->
    <div class="row">

        <!-- PRODUCTO -->
        <div class="col-md-4 mb-4"
             th:each="prod : ${productos}">

            <div class="card h-100 border-0 shadow-sm product-card">

                <!-- IMAGEN -->
                <img th:src="${prod.imagenUrl}"
                     class="card-img-top"
                     th:alt="${prod.nombre}">

                <!-- BODY -->
                <div class="card-body d-flex flex-column">

                    <!-- NOMBRE -->
                    <h5 class="fw-bold"
                        th:text="${prod.nombre}">
                        Nombre
                    </h5>

                    <!-- DESCRIPCIÓN -->
                    <p class="text-muted small flex-grow-1"
                       th:text="${prod.descripcion}">
                        Descripción
                    </p>

                    <!-- PRECIO -->
                    <h5 class="fw-bold text-dark mb-3"
                        th:text="'S/' + ${prod.precio}">
                        S/0
                    </h5>

                    <!-- BOTONES -->
                    <div class="d-flex gap-2">

                        <!-- DETALLES -->
                        <a th:href="@{/colecciones/detalle/{id}(id=${prod.id}, origen='index')}"
                           class="btn btn-outline-secondary btn-sm">

                            Ver detalles

                        </a>

                        <!-- AGREGAR -->
                        <a th:href="@{/carrito/agregar(id=${prod.id})}"
                           class="btn btn-dark btn-sm">

                            <i class="bi bi-cart-plus me-1"></i>
                            Agregar

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- FOOTER -->
<div th:replace="~{fragments :: footer}"></div>

<!-- BOOTSTRAP JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
