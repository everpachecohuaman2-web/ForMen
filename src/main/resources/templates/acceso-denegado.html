<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso denegado - ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div class="container py-5">

    <div class="col-md-7">
      <div class="card border-0 shadow text-center p-5">
        <i class="bi bi-shield-lock-fill text-danger display-2"></i>
        <h2 class="fw-bold mt-3">Acceso denegado</h2>
        <p class="text-muted">Tu sesión es válida, pero tu rol no tiene permiso para ingresar a este módulo.</p>
        <div class="d-flex justify-content-center gap-2">
          <a th:href="@{/admin/dashboard}" class="btn btn-dark">Volver al dashboard</a>
          <a th:href="@{/}" class="btn btn-outline-secondary">Ir a la tienda</a>
        </div>
      </div>
    </div>
  </div>
</div>

</html>
