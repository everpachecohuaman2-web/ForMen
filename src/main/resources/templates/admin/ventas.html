<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Ventas</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: alerts}"></div><div class="container-fluid my-4"><div class="row g-3"><div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div><div class="col-md-9"><h3>Ventas</h3><div class="table-responsive"><table class="table table-bordered bg-white align-middle"><thead class="table-dark"><tr><th>Número</th><th>Cliente</th><th>Fecha</th><th>Método</th><th>Código</th><th>Total</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="v:${ventas}"><td th:text="${v.numero}"></td><td th:text="${v.cliente.nombreCompleto}"></td><td th:text="${#temporals.format(v.fechaVenta,'dd/MM/yyyy HH:mm')}"></td><td th:text="${v.metodoPago}"></td><td th:text="${v.codigoOperacion}"></td><td th:text="'S/' + ${v.total}"></td><td><span class="badge bg-secondary" th:text="${v.estado}"></span></td><td><a class="btn btn-sm btn-dark" th:href="@{/admin/ventas/{id}(id=${v.id})}">Ver</a></td></tr></tbody></table></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
