<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container-fluid my-4">
    <div class="row g-3">
        <div class="col-md-3">
            <div th:replace="~{fragments :: admin-sidebar}"></div>
        </div>
        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Productos</h3>
                <a class="btn btn-dark" th:href="@{/admin/productos/nuevo}">
                    <i class="bi bi-plus"></i> Nuevo
                </a>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered bg-white align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p:${productos}">
                        <td>
                            <img th:src="${p.imagenUrl}" width="65" height="65" class="rounded border" style="object-fit: cover;" alt="Producto">
                        </td>
                        <td th:text="${p.nombre}"></td>
                        <td th:text="${p.categoria.nombre}"></td>
                        <td th:text="'S/' + ${p.precio}"></td>
                        <td>
                            <span th:text="${p.stock}"></span>
                            <span th:if="${p.stockBajo}" class="badge bg-warning text-dark">bajo</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${p.activo} ? ' bg-success' : ' bg-danger'"
                                  th:text="${p.activo} ? 'Activo' : 'Inactivo'"></span>
                        </td>
                        <td>
                            <div class="d-flex flex-wrap gap-1">
                                <a class="btn btn-sm btn-info text-white" th:href="@{/admin/productos/{id}/movimientos(id=${p.id})}">Movimientos</a>
                                <a class="btn btn-sm btn-primary" th:href="@{/admin/productos/editar/{id}(id=${p.id})}">Editar</a>
                                <form th:action="@{/admin/productos/estado/{id}(id=${p.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-warning">Activar/Desactivar</button>
                                </form>
                                <form th:action="@{/admin/productos/eliminar/{id}(id=${p.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar producto?')">
                                    <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
