<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Categorías</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: alerts}"></div><div class="container-fluid my-4"><div class="row g-3"><div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div><div class="col-md-9"><h3>Categorías</h3><div class="card border-0 shadow-sm mb-3"><div class="card-body"><form th:action="@{/admin/categorias/guardar}" method="post"><div class="row g-2"><div class="col-md-4"><input name="nombre" class="form-control" placeholder="Nueva categoría" required></div><div class="col-md-6"><input name="descripcion" class="form-control" placeholder="Descripción"></div><div class="col-md-2"><button class="btn btn-dark w-100">Guardar</button></div></div></form></div></div><table class="table table-bordered bg-white"><thead class="table-dark"><tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="c:${categorias}"><td th:text="${c.nombre}"></td><td th:text="${c.descripcion}"></td><td><span class="badge" th:classappend="${c.activo} ? ' bg-success' : ' bg-danger'" th:text="${c.activo}?'Activa':'Inactiva'"></span></td><td><form th:action="@{/admin/categorias/estado/{id}(id=${c.id})}" method="post" class="d-inline"><button type="submit" class="btn btn-sm btn-warning">Activar/Desactivar</button></form></td></tr></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
