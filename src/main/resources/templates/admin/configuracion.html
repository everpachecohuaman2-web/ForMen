<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Configuración</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: alerts}"></div><div class="container-fluid my-4"><div class="row g-3"><div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div><div class="col-md-9"><div class="card border-0 shadow-sm"><div class="card-body"><h3>Configuración de tienda</h3><form th:action="@{/admin/configuracion}" th:object="${config}" method="post"><input type="hidden" th:field="*{id}"><div class="row"><div class="col-md-6 mb-3"><label>Nombre tienda</label><input class="form-control" th:field="*{nombreTienda}" required></div><div class="col-md-6 mb-3"><label>WhatsApp</label><input class="form-control" th:field="*{whatsapp}"></div><div class="col-md-6 mb-3"><label>Correo</label><input type="email" class="form-control" th:field="*{correo}"></div><div class="col-md-6 mb-3"><label>Dirección</label><input class="form-control" th:field="*{direccion}"></div><div class="col-md-6 mb-3"><label>Número Yape</label><input class="form-control" th:field="*{numeroYape}"></div><div class="col-md-6 mb-3"><label>Número Plin</label><input class="form-control" th:field="*{numeroPlin}"></div><div class="col-12 mb-3"><label>Mensaje bienvenida</label><textarea class="form-control" th:field="*{mensajeBienvenida}"></textarea></div></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" th:field="*{ocultarSinStock}"><label class="form-check-label">Ocultar productos sin stock en la web</label></div><button class="btn btn-dark">Guardar configuración</button></form></div></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
