<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movimientos del producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container-fluid my-4">
    <div class="row g-3">
        <div class="col-md-3">
            <div th:replace="~{fragments :: admin-sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="mb-0">Historial de movimientos</h3>
                    <p class="text-muted mb-0" th:text="${producto.nombre + ' | Stock actual: ' + producto.stock}"></p>
                </div>
                <a class="btn btn-secondary" th:href="@{/admin/productos}">
                    <i class="bi bi-arrow-left"></i> Volver
                </a>
            </div>

            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <div class="row text-center">
                        <div class="col-md-4">
                            <div class="text-muted small">Producto</div>
                            <strong th:text="${producto.nombre}"></strong>
                        </div>
                        <div class="col-md-4">
                            <div class="text-muted small">Categoría</div>
                            <strong th:text="${producto.categoria.nombre}"></strong>
                        </div>
                        <div class="col-md-4">
                            <div class="text-muted small">Stock actual</div>
                            <strong th:text="${producto.stock}"></strong>
                        </div>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped bg-white align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Fecha y hora</th>
                        <th>Tipo</th>
                        <th>Cantidad</th>
                        <th>Stock antes</th>
                        <th>Stock después</th>
                        <th>Usuario</th>
                        <th>Motivo / referencia</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(movimientos)}">
                        <td colspan="7" class="text-center text-muted">Este producto todavía no tiene movimientos registrados.</td>
                    </tr>
                    <tr th:each="m:${movimientos}">
                        <td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm:ss')}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${m.tipo}"></span>
                        </td>
                        <td th:text="${m.cantidad}"></td>
                        <td th:text="${m.stockAntes}"></td>
                        <td th:text="${m.stockDespues}"></td>
                        <td th:text="${m.usuario}"></td>
                        <td th:text="${m.motivo}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
