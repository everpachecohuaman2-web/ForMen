<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios y roles - ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div class="container-fluid my-4">
  <div class="row g-3">
    <div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div>
    <div class="col-md-9">
      <h3 class="fw-bold">Usuarios y roles del sistema</h3>
      <p class="text-muted">Esta vista es exclusiva del administrador.</p>
      <div class="table-responsive shadow-sm">
        <table class="table table-bordered bg-white align-middle mb-0">
          <thead class="table-dark"><tr><th>Integrante</th><th>Correo</th><th>Rol</th><th>Acceso principal</th><th>Estado</th></tr></thead>
          <tbody>
          <tr th:each="usuario : ${usuariosSistema}">
            <td th:text="${usuario.nombreCompleto}"></td>
            <td th:text="${usuario.correo}"></td>
            <td><span class="badge bg-primary" th:text="${usuario.rol}"></span></td>
            <td>
              <span th:if="${usuario.rol.name() == 'ADMIN'}">Todos los módulos</span>
              <span th:if="${usuario.rol.name() == 'REPORTES'}">Reportes de solo lectura</span>
              <span th:if="${usuario.rol.name() == 'PRODUCTOS'}">Productos y categorías</span>
              <span th:if="${usuario.rol.name() == 'INVENTARIO'}">Stock y movimientos</span>
              <span th:if="${usuario.rol.name() == 'CLIENTES'}">Gestión de clientes</span>
              <span th:if="${usuario.rol.name() == 'VENTAS'}">Ventas, aprobación y rechazo</span>
              <span th:if="${usuario.rol.name() == 'EMPLEADO'}">Rol anterior de compatibilidad</span>
            </td>
            <td><span class="badge" th:classappend="${usuario.activo} ? ' bg-success' : ' bg-danger'" th:text="${usuario.activo} ? 'Activo' : 'Inactivo'"></span></td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
