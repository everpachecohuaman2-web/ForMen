<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Inventario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: alerts}"></div><div class="container-fluid my-4"><div class="row g-3"><div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div><div class="col-md-9"><h3>Inventario</h3><div class="card border-0 shadow-sm mb-3"><div class="card-body"><form th:action="@{/admin/inventario/agregar}" method="post"><div class="row g-2"><div class="col-md-4"><select name="productoId" class="form-select" required><option th:each="p:${productos}" th:value="${p.id}" th:text="${p.nombre + ' - Stock: ' + p.stock}"></option></select></div><div class="col-md-2"><input type="number" min="1" name="cantidad" class="form-control" placeholder="Cantidad" required></div><div class="col-md-4"><input name="motivo" class="form-control" placeholder="Motivo" required></div><div class="col-md-2"><button class="btn btn-dark w-100">Agregar stock</button></div></div></form></div></div><h5>Stock actual</h5><table class="table table-bordered bg-white"><thead class="table-dark"><tr><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Alerta</th></tr></thead><tbody><tr th:each="p:${productos}"><td th:text="${p.nombre}"></td><td th:text="${p.stock}"></td><td th:text="${p.stockMinimo}"></td><td><span th:if="${p.stockBajo}" class="badge bg-warning text-dark">Stock bajo</span></td></tr></tbody></table><h5>Movimientos</h5><table class="table table-striped bg-white"><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cantidad</th><th>Antes</th><th>Después</th><th>Usuario</th><th>Motivo</th></tr></thead><tbody><tr th:each="m:${movimientos}"><td th:text="${#temporals.format(m.fecha,'dd/MM/yyyy HH:mm')}"></td><td th:text="${m.producto.nombre}"></td><td th:text="${m.tipo}"></td><td th:text="${m.cantidad}"></td><td th:text="${m.stockAntes}"></td><td th:text="${m.stockDespues}"></td><td th:text="${m.usuario}"></td><td th:text="${m.motivo}"></td></tr></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
