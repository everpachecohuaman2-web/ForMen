<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head><meta charset="UTF-8"><title>Detalle venta</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"></head><body class="bg-light"><div th:replace="~{fragments :: navbar}"></div><div th:replace="~{fragments :: alerts}"></div><div class="container-fluid my-4"><div class="row g-3"><div class="col-md-3"><div th:replace="~{fragments :: admin-sidebar}"></div></div><div class="col-md-9"><h3>Venta <span th:text="${venta.numero}"></span></h3><div class="row g-3"><div class="col-md-7"><div class="card border-0 shadow-sm"><div class="card-body"><p><strong>Cliente:</strong> <span th:text="${venta.cliente.nombreCompleto}"></span></p><p><strong>Método:</strong> <span th:text="${venta.metodoPago}"></span></p><p><strong>Código:</strong> <span th:text="${venta.codigoOperacion}"></span></p><p><strong>Estado:</strong> <span class="badge bg-secondary" th:text="${venta.estado}"></span></p><p><strong>Total:</strong> <span class="fw-bold text-success" th:text="'S/' + ${venta.total}"></span></p><p><strong>Observación:</strong> <span th:text="${venta.observacion}"></span></p><a th:if="${venta.capturaPago != null and !venta.capturaPago.isBlank()}" th:href="@{/admin/ventas/{id}/captura(id=${venta.id})}" target="_blank" class="btn btn-outline-dark btn-sm"><i class="bi bi-image"></i> Ver captura</a><span th:if="${venta.capturaPago == null or venta.capturaPago.isBlank()}" class="text-muted">Sin captura registrada</span></div></div></div><div class="col-md-5" th:if="${venta.estado.name() == 'PENDIENTE'}" sec:authorize="hasAnyRole('ADMIN','VENTAS')"><div class="card border-0 shadow-sm"><div class="card-body"><form th:action="@{/admin/ventas/aprobar/{id}(id=${venta.id})}" method="post" class="mb-2"><button class="btn btn-success w-100" onclick="return confirm('¿Aprobar pago y descontar stock?')">Aprobar pago</button></form><form th:action="@{/admin/ventas/rechazar/{id}(id=${venta.id})}" method="post"><textarea name="observacion" class="form-control mb-2" placeholder="Motivo de rechazo" required></textarea><button class="btn btn-danger w-100">Rechazar venta</button></form></div></div></div></div><h5 class="mt-4">Productos</h5><table class="table table-bordered bg-white"><thead class="table-dark"><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr></thead><tbody><tr th:each="d:${venta.detalles}"><td th:text="${d.producto.nombre}"></td><td th:text="${d.cantidad}"></td><td th:text="'S/' + ${d.precioUnitario}"></td><td th:text="'S/' + ${d.subtotal}"></td></tr></tbody></table></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
