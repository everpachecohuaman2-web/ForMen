<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container-fluid my-4">
    <div class="row g-3">
        <div class="col-md-3">
            <div th:replace="~{fragments :: admin-sidebar}"></div>
        </div>

        <div class="col-md-9">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h3>Editar cliente</h3>
                    <p class="text-muted">Si colocas números o símbolos en nombres/apellidos, el sistema no guardará el cambio.</p>

                    <form th:action="@{/admin/clientes/guardar}" th:object="${cliente}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Nombres</label>
                                <input class="form-control"
                                       th:field="*{nombres}"
                                       required
                                       minlength="2"
                                       maxlength="80"
                                       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                                       title="No se permiten números ni símbolos">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Apellidos</label>
                                <input class="form-control"
                                       th:field="*{apellidos}"
                                       required
                                       minlength="2"
                                       maxlength="80"
                                       pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+"
                                       title="No se permiten números ni símbolos">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" class="form-control" th:field="*{correo}" required maxlength="120">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Teléfono</label>
                                <input class="form-control"
                                       th:field="*{telefono}"
                                       required
                                       pattern="9[0-9]{8}"
                                       maxlength="9"
                                       title="Debe tener 9 dígitos y empezar con 9">
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{activo}">
                                <label class="form-check-label">Cliente activo</label>
                            </div>
                        </div>

                        <button class="btn btn-dark">
                            <i class="bi bi-save"></i> Guardar cambios
                        </button>
                        <a class="btn btn-secondary" th:href="@{/admin/clientes}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
