<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div class="container my-5"><div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card border-0 shadow p-4">
    <div class="text-center mb-3"><i class="bi bi-person-circle fs-1 text-dark"></i><h4 class="mt-2 fw-bold">Iniciar Sesión</h4><p class="text-muted small">Bienvenido a <strong>ForMen</strong></p></div>
    <div th:if="${param.registrado}" class="alert alert-success small"><i class="bi bi-check-circle me-1"></i> Cuenta creada. Ya puedes iniciar sesión.</div>
    <div th:if="${param.error}" class="alert alert-danger small"><i class="bi bi-x-circle me-1"></i> Correo o contraseña incorrectos.</div>
    <div th:if="${param.logout}" class="alert alert-info small">Sesión cerrada.</div>
    <form th:action="@{/login}" method="post">
      <div class="mb-3"><label class="form-label small fw-semibold">Correo</label><input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required></div>
      <div class="mb-3"><label class="form-label small fw-semibold">Contraseña</label><input type="password" name="password" class="form-control" required></div>
      <button type="submit" class="btn btn-dark w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión</button>
      <p class="text-center mt-3 small">¿No tienes cuenta? <a th:href="@{/registro}" class="text-dark fw-semibold">Regístrate</a></p>
    </form>
  </div>
</div></div></div>
<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
