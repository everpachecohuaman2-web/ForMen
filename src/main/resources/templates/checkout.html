<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<div class="container my-5">
  <div class="row g-4">
    <div class="col-lg-7">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-dark text-white"><i class="bi bi-credit-card me-2"></i>Pago manual</div>
        <div class="card-body">
          <div class="alert alert-info small">Realiza el pago por Yape o Plin, sube la captura e ingresa el código de operación. La venta quedará pendiente para revisión del administrador.</div>
          <p class="mb-1"><strong>Yape:</strong> <span th:text="${config.numeroYape}"></span></p>
          <p><strong>Plin:</strong> <span th:text="${config.numeroPlin}"></span></p>
          <form th:action="@{/carrito/confirmar}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
              <label class="form-label fw-semibold">Método de pago</label>
              <select name="metodoPago" class="form-select" required>
                <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Código de operación</label>
              <input type="text"
                     name="codigoOperacion"
                     class="form-control"
                     minlength="3"
                     maxlength="30"
                     pattern="[A-Za-z0-9]{3,30}"
                     inputmode="text"
                     required
                     placeholder="Código único del pago">
              <div class="form-text">No se permite repetir un código ya usado. No ingreses negativos, guiones ni signos.</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Captura de pago</label>
              <input type="file" name="capturaPago" class="form-control" accept=".jpg,.jpeg,.png,.webp" required>
            </div>
            <button class="btn btn-success w-100"><i class="bi bi-send-check me-1"></i>Registrar pedido</button>
          </form>
        </div>
      </div>
    </div>
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">Resumen</div>
        <div class="card-body">
          <div th:each="item : ${items}" class="d-flex justify-content-between border-bottom py-2">
            <span><span th:text="${item.producto.nombre}"></span> x <span th:text="${item.cantidad}"></span></span>
            <strong th:text="'S/' + ${item.subtotal}"></strong>
          </div>
          <div class="d-flex justify-content-between mt-3 fs-5"><strong>Total</strong><strong class="text-success" th:text="'S/' + ${total}"></strong></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
