<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro – ForMen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<div th:replace="~{fragments :: alerts}"></div>
<div class="container my-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card border-0 shadow p-4">
    <div class="text-center mb-3">
      <i class="bi bi-person-plus-fill fs-1 text-dark"></i>
      <h4 class="mt-2 fw-bold">Crear Cuenta</h4>
      <p class="text-muted small">Regístrate para comprar en <strong>ForMen</strong></p>
    </div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post" novalidate>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label small fw-semibold">Nombres</label>
          <input type="text" th:field="*{nombres}" class="form-control"
                 th:classappend="${#fields.hasErrors('nombres')} ? 'is-invalid'"
                 placeholder="Ej: Junior" minlength="2" maxlength="80"
                 pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]+$" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('nombres')}" th:errors="*{nombres}"></div>
          <div class="form-text">Solo letras y espacios. No números.</div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label small fw-semibold">Apellidos</label>
          <input type="text" th:field="*{apellidos}" class="form-control"
                 th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"
                 placeholder="Ej: Bazán Carrión" minlength="2" maxlength="80"
                 pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]+$" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
          <div class="form-text">Solo letras y espacios. No números.</div>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Teléfono</label>
        <input type="tel" th:field="*{telefono}" class="form-control"
               th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"
               placeholder="9XXXXXXXX" pattern="^9\d{8}$" maxlength="9" required>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
        <div class="form-text">Debe tener 9 dígitos y empezar con 9.</div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <input type="email" th:field="*{correo}" class="form-control"
               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"
               placeholder="correo@ejemplo.com" maxlength="120" required>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input type="password" name="password" class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
               minlength="6" maxlength="60" required>
        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        <div class="form-text">Mínimo 6 caracteres.</div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="terminos" required>
        <label class="form-check-label small" for="terminos">Acepto los términos y condiciones</label>
      </div>

      <button type="submit" class="btn btn-dark w-100"><i class="bi bi-person-check me-1"></i>Crear Cuenta</button>
      <p class="text-center mt-3 small">¿Ya tienes cuenta? <a th:href="@{/login}" class="text-dark fw-semibold">Inicia sesión</a></p>
    </form>
  </div>
</div></div></div>
<div th:replace="~{fragments :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
