spring.application.name=ForMen
server.port=8080

# ==============================================================
# BASE DE DATOS - XAMPP / MySQL / MariaDB
# ==============================================================
# 1. Inicia el modulo MySQL desde XAMPP antes de ejecutar el proyecto.
# 2. createDatabaseIfNotExist=true crea bd_formen automaticamente.
# 3. Puedes cambiar los datos mediante DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/bd_formen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tiempo maximo para detectar rapidamente si XAMPP/MySQL esta apagado
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==============================================================
# THYMELEAF
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ==============================================================
# ARCHIVOS
# ==============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
spring.messages.encoding=UTF-8
